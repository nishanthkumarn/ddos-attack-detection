name: CI
on:
  push:
  pull_request:
jobs:
  python:
    strategy:
      matrix:
        task: [lint, unit, integration, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.14'}
      - run: pip install -r backend/requirements.txt
      - name: lint
        if: matrix.task == 'lint'
        run: ruff check backend
      - name: unit
        if: matrix.task == 'unit'
        run: pytest tests -q
      - name: integration
        if: matrix.task == 'integration'
        run: pytest backend/tests -q
      - name: e2e
        if: matrix.task == 'e2e'
        run: |
          nohup uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          sleep 3
          python backend/scripts/e2e.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package.json}
      - run: cd frontend && npm install && npm run lint && npm run build
  images:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix: {target: [backend, frontend]}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: ddos-detector:${{ matrix.target }}
