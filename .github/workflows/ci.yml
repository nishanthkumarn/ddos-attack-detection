name: CI
on:
  push:
  pull_request:
jobs:
  python:
    strategy:
      matrix:
        task: [lint, unit, integration, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.14'}
      - run: pip install -r backend/requirements.txt
      - name: lint
        if: matrix.task == 'lint'
        run: ruff check backend
      - name: unit
        if: matrix.task == 'unit'
        run: pytest tests -q
      - name: integration
        if: matrix.task == 'integration'
        run: pytest backend/tests -q
      - name: e2e
        if: matrix.task == 'e2e'
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/uvicorn.log
              exit 1
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
            cat /tmp/uvicorn.log
            echo "API failed to become ready within 30 seconds."
            exit 1
          fi
          python backend/scripts/e2e.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package.json}
      - run: cd frontend && npm install && npm run lint && npm run build
  images:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix: {target: [backend, frontend]}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: ddos-detector:${{ matrix.target }}
